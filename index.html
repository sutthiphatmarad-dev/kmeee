<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemical Titration Simulator - ม.5 Pro HD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: rgba(18, 26, 43, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --accent-primary: #00d2ff;
      --accent-secondary: #ff2a5f;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }

    body {
      background: #060911;
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 210, 255, 0.15) 0px, transparent 40%),
        radial-gradient(at 90% 90%, rgba(255, 42, 95, 0.15) 0px, transparent 40%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 1.25rem 2rem;
      background: rgba(10, 15, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .badge {
      background: linear-gradient(135deg, #00d2ff, #0072ff);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 968px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 380px;
      background: radial-gradient(circle at center, rgba(18, 28, 48, 0.8), rgba(8, 12, 22, 0.95));
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }

    canvas#labCanvas { width: 100%; height: 100%; }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #ff0844, #ffb199);
      border: none;
      box-shadow: 0 4px 15px rgba(255, 8, 68, 0.3);
    }

    .btn-purple {
      background: linear-gradient(135deg, #b224ef, #7579ff);
      border: none;
      box-shadow: 0 4px 15px rgba(117, 121, 255, 0.3);
    }

    .btn-calc {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .stat-card {
      background: rgba(10, 16, 28, 0.6);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ph-meter {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-top: 0.25rem;
      background: linear-gradient(135deg, #00d2ff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    .chart-box {
      height: 220px;
      width: 100%;
    }

    .quiz-section {
      background: rgba(10, 16, 28, 0.7);
      border-radius: 1rem;
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    input[type="number"] {
      width: 100%;
      background: rgba(5, 8, 15, 0.8);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      color: white;
      font-size: 1rem;
      outline: none;
      margin-top: 0.5rem;
    }

    input[type="number"]:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    /* เครื่องคิดเลข Floating Window */
    .calc-window {
      position: absolute;
      top: 90px;
      right: 30px;
      width: 320px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 1rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      z-index: 999;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .calc-header {
      background: rgba(30, 41, 59, 0.9);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
    }

    .calc-display {
      background: #020617;
      padding: 1rem;
      text-align: right;
      font-size: 1.6rem;
      color: #38bdf8;
      font-family: monospace;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 60px;
      word-break: break-all;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      padding: 1rem;
    }

    .calc-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .calc-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .calc-btn-op {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    .calc-btn-eq {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px;">🧪 Chemical Titration Simulator <span style="font-size: 0.75rem; color: #00d2ff; font-weight: 400;">HD Lab</span></h1>
      <p style="font-size: 0.8rem; color: var(--text-muted);">ระบบจำลองการไทเทรตกรด-เบส และคำนวณจุดยุติ | เคมี ม.5</p>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <button class="btn btn-calc" onclick="toggleCalc()" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">🧮 เครื่องคิดเลข</button>
      <span class="badge">เกรด 4 Target</span>
    </div>
  </header>

  <div class="main-layout">
    <!-- ซีกซ้าย: โต๊ะทดลอง -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.1rem; font-weight: 600;">🥼 โต๊ะการทดลอง (Interactive Lab)</h2>
        <button class="btn" onclick="resetLab()" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">🔄 รีเซ็ตการทดลองนี้</button>
      </div>

      <div class="canvas-container">
        <canvas id="labCanvas"></canvas>
      </div>

      <div class="control-grid">
        <button class="btn btn-primary" onclick="addBase(0.1)">💧 หยดทีละนิด (+0.1 mL)</button>
        <button class="btn btn-primary" onclick="addBase(1.0)">🌊 ปล่อยสายสาร (+1.0 mL)</button>
        <button class="btn" onclick="toggleAutoDrop()" id="autoBtn">▶️ เปิดหยดอัตโนมัติ</button>
        <button class="btn btn-secondary" onclick="addBase(5.0)">⚡ เร่งสปีด (+5.0 mL)</button>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="stat-card">
          <div style="font-size: 0.85rem; color: var(--text-muted);">ปริมาตร NaOH (V2)</div>
          <div style="font-size: 1.5rem; font-weight: 600; text-align: center; margin-top: 0.25rem; color: #00d2ff;" id="volDisplay">0.00 mL</div>
        </div>
        <div class="stat-card">
          <div style="font-size: 0.85rem; color: var(--text-muted);">ค่า pH ปัจจุบัน</div>
          <div class="ph-meter" id="phDisplay">1.00</div>
        </div>
      </div>
    </div>

    <!-- ซีกขวา: กราฟ + คำถาม -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.1rem; font-weight: 600;">📊 กราฟการไทเทรต & วิเคราะห์ผล</h2>
        <button class="btn btn-purple" onclick="randomNewProblem()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">🔀 สุ่มโจทย์ใหม่</button>
      </div>
      
      <div class="chart-box">
        <canvas id="titrationChart"></canvas>
      </div>

      <div class="quiz-section">
        <h3 style="font-size: 1rem; margin-bottom: 0.5rem; color: var(--accent-primary);" id="questionTitle">📝 คำนวณหาความเข้มข้นของกรด HCl (M1)</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;" id="problemDetails">
          <!-- เนื้อหาโจทย์อัปเดตอัตโนมัติผ่าน JS -->
        </p>

        <div style="margin-top: 1rem;">
          <label style="font-size: 0.85rem;" id="inputLabel">กรอกค่าคำตอบที่คำนวณได้:</label>
          <input type="number" id="userAns" placeholder="กรอกตัวเลขคำตอบ" step="0.001">
          <button class="btn btn-primary" onclick="checkAnswer()" style="width: 100%; margin-top: 0.75rem;">ส่งคำตอบประเมินผล</button>
        </div>

        <div id="resultBox" style="margin-top: 1rem; display: none; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.9rem;"></div>
      </div>
    </div>
  </div>

  <!-- เครื่องคิดเลข Floating Window -->
  <div class="calc-window" id="calcWindow">
    <div class="calc-header" id="calcHeader">
      <span style="font-size: 0.85rem; font-weight: 600;">🧮 เครื่องคิดเลขวิทยาศาสตร์</span>
      <span style="cursor: pointer; font-size: 1.1rem;" onclick="toggleCalc()">✖</span>
    </div>
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button class="calc-btn calc-btn-op" onclick="calcClear()">C</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp('(')">(</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp(')')">)</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp('/')">÷</button>
      
      <button class="calc-btn" onclick="calcNum('7')">7</button>
      <button class="calc-btn" onclick="calcNum('8')">8</button>
      <button class="calc-btn" onclick="calcNum('9')">9</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp('*')">×</button>
      
      <button class="calc-btn" onclick="calcNum('4')">4</button>
      <button class="calc-btn" onclick="calcNum('5')">5</button>
      <button class="calc-btn" onclick="calcNum('6')">6</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp('-')">-</button>
      
      <button class="calc-btn" onclick="calcNum('1')">1</button>
      <button class="calc-btn" onclick="calcNum('2')">2</button>
      <button class="calc-btn" onclick="calcNum('3')">3</button>
      <button class="calc-btn calc-btn-op" onclick="calcOp('+')">+</button>
      
      <button class="calc-btn" onclick="calcNum('0')">0</button>
      <button class="calc-btn" onclick="calcNum('.')">.</button>
      <button class="calc-btn calc-btn-eq" onclick="calcEval()">=</button>
    </div>
  </div>

  <script>
    // ตัวแปรเคมี
    let V1 = 25.0; 
    let M1 = 0.08;
    let M2 = 0.10; 
    let exactV2 = 20.0;
    let currentV2 = 0;
    let autoInterval = null;

    let targetVariable = 'M1'; // M1, M2, V1, V2
    let correctAnswer = 0;

    // Canvas Logic
    const canvas = document.getElementById('labCanvas');
    const ctx = canvas.getContext('2d');
    let drops = [];
    let bubbles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initProblem() {
      const v1Options = [10.0, 15.0, 20.0, 25.0, 30.0, 50.0];
      const m2Options = [0.05, 0.10, 0.15, 0.20];
      
      V1 = v1Options[Math.floor(Math.random() * v1Options.length)];
      M2 = m2Options[Math.floor(Math.random() * m2Options.length)];
      M1 = Math.round((Math.random() * 0.20 + 0.04) * 1000) / 1000;
      exactV2 = (M1 * V1) / M2;
      
      currentV2 = 0;
      drops = [];
      bubbles = [];

      const varTypes = ['M1', 'M2', 'V1', 'V2'];
      targetVariable = varTypes[Math.floor(Math.random() * varTypes.length)];

      updateUIForProblem();

      if (titrationChart) {
        chartData.labels = [0];
        chartData.datasets[0].data = [calculatepH(0)];
        titrationChart.update();
      }
    }

    function updateUIForProblem() {
      const titleEl = document.getElementById('questionTitle');
      const detailsEl = document.getElementById('problemDetails');
      const labelEl = document.getElementById('inputLabel');

      if (targetVariable === 'M1') {
        correctAnswer = M1;
        titleEl.innerText = '📝 คำนวณหาความเข้มข้นของกรด HCl (M1)';
        labelEl.innerText = 'กรอกค่าความเข้มข้น M1 ที่คำนวณได้ (โมลาร์, M):';
        detailsEl.innerHTML = `
          <b>ข้อมูลชุดทดลอง:</b><br>
          • ปริมาตรกรด HCl (V1) = <b>${V1.toFixed(2)} mL</b><br>
          • ความเข้มข้นเบส NaOH (M2) = <b>${M2.toFixed(2)} M</b><br>
          • ปริมาตรเบสที่จุดยุติ (V2) = <i>ทดลองไทเทรตในแล็บเพื่อหาค่า V2</i>
        `;
      } else if (targetVariable === 'M2') {
        correctAnswer = M2;
        titleEl.innerText = '📝 คำนวณหาความเข้มข้นของเบส NaOH (M2)';
        labelEl.innerText = 'กรอกค่าความเข้มข้น M2 ที่คำนวณได้ (โมลาร์, M):';
        detailsEl.innerHTML = `
          <b>ข้อมูลชุดทดลอง:</b><br>
          • ปริมาตรกรด HCl (V1) = <b>${V1.toFixed(2)} mL</b><br>
          • ความเข้มข้นกรด HCl (M1) = <b>${M1.toFixed(3)} M</b><br>
          • ปริมาตรเบสที่จุดยุติ (V2) = <i>ทดลองไทเทรตในแล็บเพื่อหาค่า V2</i>
        `;
      } else if (targetVariable === 'V1') {
        correctAnswer = V1;
        titleEl.innerText = '📝 คำนวณหาปริมาตรตั้งต้นของกรด HCl (V1)';
        labelEl.innerText = 'กรอกค่าปริมาตรกรด V1 ที่คำนวณได้ (mL):';
        detailsEl.innerHTML = `
          <b>ข้อมูลชุดทดลอง:</b><br>
          • ความเข้มข้นกรด HCl (M1) = <b>${M1.toFixed(3)} M</b><br>
          • ความเข้มข้นเบส NaOH (M2) = <b>${M2.toFixed(2)} M</b><br>
          • ปริมาตรเบสที่จุดยุติ (V2) = <i>ทดลองไทเทรตในแล็บเพื่อหาค่า V2</i>
        `;
      } else if (targetVariable === 'V2') {
        correctAnswer = exactV2;
        titleEl.innerText = '📝 คำนวณหาปริมาตรเบส NaOH ณ จุดยุติ (V2)';
        labelEl.innerText = 'กรอกค่าปริมาตรเบส V2 ณ จุดยุติที่คำนวณได้ (mL):';
        detailsEl.innerHTML = `
          <b>ข้อมูลชุดทดลอง:</b><br>
          • ปริมาตรกรด HCl (V1) = <b>${V1.toFixed(2)} mL</b><br>
          • ความเข้มข้นกรด HCl (M1) = <b>${M1.toFixed(3)} M</b><br>
          • ความเข้มข้นเบส NaOH (M2) = <b>${M2.toFixed(2)} M</b><br>
          <i>(คำนวณตามทฤษฎีจาก M1·V1 = M2·V2 หรือสังเกตจากการไทเทรต)</i>
        `;
      }
    }

    function calculatepH(v2) {
      const molesAcid = (V1 / 1000) * M1;
      const molesBase = (v2 / 1000) * M2;
      const totalVol = (V1 + v2) / 1000;

      if (molesBase < molesAcid) {
        const remAcid = molesAcid - molesBase;
        const hConc = remAcid / totalVol;
        return Math.max(1.0, -Math.log10(hConc));
      } else if (Math.abs(molesBase - molesAcid) < 1e-7) {
        return 7.0;
      } else {
        const remBase = molesBase - molesAcid;
        const ohConc = remBase / totalVol;
        const pOH = -Math.log10(ohConc);
        return Math.min(13.5, 14 - pOH);
      }
    }

    function getColorForpH(ph) {
      if (ph < 8.2) return { fill: 'rgba(215, 238, 255, 0.45)', glow: 'rgba(56, 189, 248, 0.25)' };
      if (ph >= 8.2 && ph <= 10.0) {
        const alpha = (ph - 8.2) / 1.8;
        return { 
          fill: `rgba(255, 80, 140, ${0.45 + alpha * 0.4})`,
          glow: `rgba(255, 80, 140, ${0.5 + alpha * 0.4})`
        };
      }
      return { fill: 'rgba(240, 15, 90, 0.9)', glow: 'rgba(255, 15, 90, 0.8)' };
    }

    function drawLab() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;

      // ขาตั้งโลหะ
      let standGrad = ctx.createLinearGradient(cx + 40, 0, cx + 50, 0);
      standGrad.addColorStop(0, '#334155');
      standGrad.addColorStop(0.5, '#94a3b8');
      standGrad.addColorStop(1, '#1e293b');
      
      ctx.fillStyle = standGrad;
      ctx.fillRect(cx - 70, 340, 140, 12);
      ctx.fillRect(cx + 45, 20, 8, 320);

      // แคลมป์จับ
      ctx.fillStyle = '#64748b';
      ctx.fillRect(cx + 10, 100, 37, 8);

      // บิวเรตต์
      let buretteGrad = ctx.createLinearGradient(cx - 12, 0, cx + 12, 0);
      buretteGrad.addColorStop(0, 'rgba(255,255,255,0.5)');
      buretteGrad.addColorStop(0.3, 'rgba(255,255,255,0.1)');
      buretteGrad.addColorStop(1, 'rgba(255,255,255,0.3)');

      ctx.fillStyle = buretteGrad;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.fillRect(cx - 10, 15, 20, 160);
      ctx.strokeRect(cx - 10, 15, 20, 160);

      // สารละลายในบิวเรตต์
      const baseHeight = Math.max(0, 140 - (currentV2 / 50) * 140);
      let liquidGrad = ctx.createLinearGradient(cx - 8, 0, cx + 8, 0);
      liquidGrad.addColorStop(0, 'rgba(0, 210, 255, 0.7)');
      liquidGrad.addColorStop(1, 'rgba(0, 114, 255, 0.5)');
      ctx.fillStyle = liquidGrad;
      ctx.fillRect(cx - 8, 15 + (140 - baseHeight), 16, baseHeight);

      // หัวก๊อกบิวเรตต์
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(cx - 14, 175, 28, 6);

      // หยดสาร
      for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        ctx.beginPath();
        ctx.arc(cx, d.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00d2ff';
        ctx.shadowColor = '#00d2ff';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
        d.y += 6;

        if (d.y >= 275) {
          drops.splice(i, 1);
          if (bubbles.length < 15) {
            bubbles.push({ x: cx + (Math.random() * 30 - 15), y: 310, r: Math.random() * 3 + 1, alpha: 1 });
          }
        }
      }

      // วาดสารละลายในขวดรูปชมพู่
      const ph = calculatepH(currentV2);
      const colorObj = getColorForpH(ph);
      const totalVolume = V1 + currentV2;
      const liquidTopY = Math.max(250, 305 - (totalVolume / 80) * 60);

      ctx.save();
      ctx.beginPath();
      
      const widthRatioAtTop = (320 - liquidTopY) / 100;
      const liquidHalfWidth = 12 + widthRatioAtTop * 43;

      ctx.moveTo(cx - liquidHalfWidth, liquidTopY);
      ctx.lineTo(cx + liquidHalfWidth, liquidTopY);
      ctx.lineTo(cx + 55, 320);
      ctx.quadraticCurveTo(cx, 330, cx - 55, 320);
      ctx.closePath();

      ctx.fillStyle = colorObj.fill;
      ctx.shadowColor = colorObj.glow;
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // ขอบผิวน้ำ
      ctx.beginPath();
      ctx.ellipse(cx, liquidTopY, liquidHalfWidth, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.fill();

      // โครงขวดแก้ว
      ctx.beginPath();
      ctx.moveTo(cx - 12, 220);
      ctx.lineTo(cx + 12, 220);
      ctx.lineTo(cx + 55, 320);
      ctx.quadraticCurveTo(cx, 330, cx - 55, 320);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // ฟองอากาศ
      for (let i = bubbles.length - 1; i >= 0; i--) {
        let b = bubbles[i];
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
        ctx.fill();
        b.y -= 0.8;
        b.alpha -= 0.02;
        if (b.alpha <= 0) bubbles.splice(i, 1);
      }

      requestAnimationFrame(drawLab);
    }

    // Chart.js Configuration
    const chartCtx = document.getElementById('titrationChart').getContext('2d');
    const chartData = {
      labels: [0],
      datasets: [{
        label: 'pH Curve',
        data: [1.0],
        borderColor: '#00d2ff',
        borderWidth: 2.5,
        tension: 0.3,
        pointRadius: 0
      }]
    };

    const titrationChart = new Chart(chartCtx, {
      type: 'line',
      data: chartData,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { title: { display: true, text: 'NaOH (mL)', color: '#94a3b8' }, ticks: { color: '#94a3b8' } },
          y: { title: { display: true, text: 'pH', color: '#94a3b8' }, min: 0, max: 14, ticks: { color: '#94a3b8' } }
        },
        plugins: { legend: { display: false } }
      }
    });

    function addBase(amount) {
      currentV2 += amount;
      drops.push({ y: 181 });

      const ph = calculatepH(currentV2);
      
      document.getElementById('volDisplay').innerText = currentV2.toFixed(2) + ' mL';
      document.getElementById('phDisplay').innerText = ph.toFixed(2);

      chartData.labels.push(currentV2.toFixed(1));
      chartData.datasets[0].data.push(ph);
      titrationChart.update();
    }

    function toggleAutoDrop() {
      const btn = document.getElementById('autoBtn');
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        btn.innerText = '▶️ เปิดหยดอัตโนมัติ';
      } else {
        autoInterval = setInterval(() => {
          if (currentV2 >= 50) toggleAutoDrop();
          addBase(0.1);
        }, 120);
        btn.innerText = '⏸️ หยุดหยดอัตโนมัติ';
      }
    }

    function resetLab() {
      if (autoInterval) toggleAutoDrop();
      currentV2 = 0;
      drops = [];
      bubbles = [];
      chartData.labels = [0];
      chartData.datasets[0].data = [calculatepH(0)];
      if (titrationChart) titrationChart.update();
      
      document.getElementById('volDisplay').innerText = '0.00 mL';
      document.getElementById('phDisplay').innerText = calculatepH(0).toFixed(2);
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('userAns').value = '';
    }

    function randomNewProblem() {
      resetLab();
      initProblem();
    }

    function checkAnswer() {
      const userAns = parseFloat(document.getElementById('userAns').value);
      const resBox = document.getElementById('resultBox');
      resBox.style.display = 'block';

      if (isNaN(userAns)) {
        resBox.style.background = 'rgba(234, 179, 8, 0.2)';
        resBox.style.color = '#fde047';
        resBox.innerText = '⚠️ กรุณากรอกตัวเลขคำตอบก่อนส่งประเมิน';
        return;
      }

      const tolerance = (targetVariable === 'V1' || targetVariable === 'V2') ? 0.3 : 0.005;
      const unitStr = (targetVariable === 'V1' || targetVariable === 'V2') ? 'mL' : 'M';

      if (Math.abs(userAns - correctAnswer) <= tolerance) {
        resBox.style.background = 'rgba(34, 197, 94, 0.2)';
        resBox.style.color = '#4ade80';
        resBox.innerText = `🎉 ถูกต้องแม่นยำ! คำตอบของ ${targetVariable} คือ ${correctAnswer.toFixed(3)} ${unitStr}`;
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else {
        resBox.style.background = 'rgba(239, 68, 68, 0.2)';
        resBox.style.color = '#fca5a5';
        resBox.innerText = `❌ ยังไม่ถูกต้อง (คำตอบที่ถูกต้องคือประมาณ ${correctAnswer.toFixed(3)} ${unitStr}) ลองคำนวณใหม่อีกครั้งครับ`;
      }
    }

    // ฟังก์ชันเครื่องคิดเลข
    let calcExpr = '';
    
    function toggleCalc() {
      const win = document.getElementById('calcWindow');
      win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
    }

    function calcNum(val) {
      if (calcExpr === '0') calcExpr = '';
      calcExpr += val;
      document.getElementById('calcDisplay').innerText = calcExpr;
    }

    function calcOp(op) {
      calcExpr += op;
      document.getElementById('calcDisplay').innerText = calcExpr;
    }

    function calcClear() {
      calcExpr = '';
      document.getElementById('calcDisplay').innerText = '0';
    }

    function calcEval() {
      try {
        let res = eval(calcExpr);
        document.getElementById('calcDisplay').innerText = res;
        calcExpr = res.toString();
      } catch (e) {
        document.getElementById('calcDisplay').innerText = 'Error';
        calcExpr = '';
      }
    }

    // ลากย้ายหน้าต่างเครื่องคิดเลข (Drag Feature)
    const dragWin = document.getElementById("calcWindow");
    const dragHeader = document.getElementById("calcHeader");
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

    dragHeader.onmousedown = dragMouseDown;

    function dragMouseDown(e) {
      e.preventDefault();
      pos3 = e.clientX;
      pos4 = e.clientY;
      document.onmouseup = closeDragElement;
      document.onmousemove = elementDrag;
    }

    function elementDrag(e) {
      e.preventDefault();
      pos1 = pos3 - e.clientX;
      pos2 = pos4 - e.clientY;
      pos3 = e.clientX;
      pos4 = e.clientY;
      dragWin.style.top = (dragWin.offsetTop - pos2) + "px";
      dragWin.style.left = (dragWin.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
      document.onmouseup = null;
      document.onmousemove = null;
    }

    // เริ่มต้นทำงาน
    initProblem();
    drawLab();
  </script>
</body>
</html>
